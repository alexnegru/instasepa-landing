name = "instasepa-malta"
main = "src/index.js"
compatibility_date = "2024-10-01"
account_id = "eef8d238bbf712c0681929822f7bf9bf"

workers_dev = true

routes = [
  { pattern = "malta.instasepa.eu", custom_domain = true },
]

# Visitor analytics (same module as the demo workers): daily counters +
# Telegram DM. Namespace title on Cloudflare: "MALTA".
[[kv_namespaces]]
binding = "STATE"
id = "378b8bb9015740438ac2a030969927e5"

# Secrets set via `wrangler secret put`:
#   TELEGRAM_BOT_TOKEN   (same bot as the demo workers; analytics recipients
#                         default to Alex's DM, override in KV key `analytics`)
